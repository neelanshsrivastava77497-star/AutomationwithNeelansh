<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanuman Ji SVG Art</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(to bottom,#87CEEB,#FFF8DC);
}
svg{
    width:400px;
    height:500px;
}
</style>
</head>
<body>

<svg viewBox="0 0 400 500">

    <!-- Halo -->
    <circle cx="200" cy="80" r="45" fill="gold" opacity="0.5"/>

    <!-- Face -->
    <circle cx="200" cy="100" r="40" fill="#F4C28B" stroke="#000" stroke-width="2"/>

    <!-- Crown -->
    <path d="M160 70 L200 30 L240 70 Z" fill="gold"/>
    <rect x="165" y="68" width="70" height="10" fill="gold"/>

    <!-- Eyes -->
    <circle cx="185" cy="95" r="3"/>
    <circle cx="215" cy="95" r="3"/>

    <!-- Smile -->
    <path d="M185 115 Q200 128 215 115"
          fill="none"
          stroke="#000"
          stroke-width="2"/>

    <!-- Tilak -->
    <line x1="200" y1="82" x2="200" y2="100"
          stroke="red"
          stroke-width="3"/>

    <!-- Body -->
    <rect x="170" y="140" width="60" height="100"
          rx="20"
          fill="#FF9933"/>

    <!-- Arms -->
    <line x1="170" y1="160" x2="120" y2="220"
          stroke="#F4C28B"
          stroke-width="12"/>
    <line x1="230" y1="160" x2="280" y2="220"
          stroke="#F4C28B"
          stroke-width="12"/>

    <!-- Legs -->
    <line x1="185" y1="240" x2="170" y2="320"
          stroke="#F4C28B"
          stroke-width="12"/>
    <line x1="215" y1="240" x2="230" y2="320"
          stroke="#F4C28B"
          stroke-width="12"/>

    <!-- Tail -->
    <path d="M235 180
             C320 150 330 260 250 300"
          fill="none"
          stroke="#C68642"
          stroke-width="8"/>

    <!-- Gada (Mace) -->
    <line x1="285" y1="220" x2="330" y2="310"
          stroke="#8B5A2B"
          stroke-width="6"/>
    <circle cx="340" cy="325" r="18"
            fill="gold"
            stroke="#B8860B"
            stroke-width="3"/>

</svg>

</body>
</html>
